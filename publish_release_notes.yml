trigger: none

pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: Atlassian

steps:
- script: |
      set -euo pipefail

      #hardcoded!
      PROJECT_KEY="BN"
      FIX_VERSION="1.2.1"
      RELEASE_TITLE="Release Notes – Version 1.2.1"

      echo "Generating release notes for Jira project $PROJECT_KEY, fixVersion $FIX_VERSION..."

      JIRA_AUTH=$(echo -n "$JIRA_EMAIL:$JIRA_API_TOKEN" | base64)
      CONF_AUTH=$(echo -n "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" | base64)

      # Prepare JQL + pagination
      JQL="project = $PROJECT_KEY AND fixVersion = \"$FIX_VERSION\" ORDER BY issuetype, priority"
      NEXT_TOKEN=null
      ISSUES_JSON="[]"

      while : ; do
        # Build body for POST
        body=$(jq -n --arg jql "$JQL" --argjson token "$NEXT_TOKEN" '{
          jql: $jql,
          maxResults: 100,
          nextPageToken: $token,
          fields: ["key", "summary", "issuetype"]
        }')

        echo "Calling Jira API, nextPageToken = $NEXT_TOKEN"
        resp=$(curl -s \
          -H "Authorization: Basic $JIRA_AUTH" \
          -H "Content-Type: application/json" \
          -d "$body" \
          "$JIRA_BASE_URL/rest/api/3/search/jql")

        # Parse response
        issuesPage=$(echo "$resp" | jq '.issues')
        ISSUES_JSON=$(echo "$ISSUES_JSON" | jq ". + $issuesPage")

        # Get new nextPageToken
        NEXT_TOKEN=$(echo "$resp" | jq -r '.nextPageToken // "null"')

        # Check if this was the last page
        isLast=$(echo "$resp" | jq -r '.isLast // true')
        if [ "$isLast" = "true" ] || [ "$NEXT_TOKEN" = "null" ]; then
          break
        fi
      done
      
