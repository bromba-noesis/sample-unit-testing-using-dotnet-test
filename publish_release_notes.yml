trigger: none

pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: Atlassian

steps:
- script: |
      set -euo pipefail

      #hardcoded!
      PROJECT_KEY="BN"
      FIX_VERSION="1.2.1"
      RELEASE_TITLE="Release Notes – Version 1.2.1"

      # -------------------------
      # Validate required variables
      # -------------------------
      : "${JIRA_BASE_URL:?JIRA_BASE_URL is required}"
      : "${CONFLUENCE_BASE_URL:?CONFLUENCE_BASE_URL is required}"
      : "${JIRA_EMAIL:?JIRA_EMAIL is required}"
      : "${JIRA_API_TOKEN:?JIRA_API_TOKEN is required}"
      : "${CONFLUENCE_EMAIL:?CONFLUENCE_EMAIL is required}"
      : "${CONFLUENCE_API_TOKEN:?CONFLUENCE_API_TOKEN is required}"

      # -------------------------
      # Encode credentials
      # -------------------------
      JIRA_AUTH=$(echo -n "$JIRA_EMAIL:$JIRA_API_TOKEN" | base64)
      CONF_AUTH=$(echo -n "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" | base64)

      # -------------------------
      # Build JQL
      # -------------------------
      JQL="project = $PROJECT_KEY AND fixVersion = \"$FIX_VERSION\" ORDER BY issuetype, priority"

      # -------------------------
      # Pagination variables
      # -------------------------
      NEXT_TOKEN=null
      ALL_ISSUES_JSON="[]"

      echo "Fetching Jira issues for $PROJECT_KEY fixVersion $FIX_VERSION..."

      while : ; do
        # Build payload for POST
        PAYLOAD=$(jq -n --arg jql "$JQL" --argjson token "$NEXT_TOKEN" '{
          jql: $jql,
          maxResults: 100,
          nextPageToken: $token,
          fields: ["key", "summary", "issuetype"]
        }')

        if [ -z "$PAYLOAD" ]; then
          echo "Error: payload for curl is empty"
          exit 1
        fi

        echo aaa

        # Call Jira API
        RESP=$(curl -s \
          -H "Authorization: Basic $JIRA_AUTH" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD" \
          "$JIRA_BASE_URL/rest/api/3/search/jql")

        echo $?
        
        echo bbb

        if [ -z "$RESP" ]; then
          echo "Error: empty response from Jira API"
          exit 1
        fi

        ISSUES_PAGE=$(echo "$RESP" | jq '.issues')
        ALL_ISSUES_JSON=$(echo "$ALL_ISSUES_JSON" | jq ". + $ISSUES_PAGE")

        NEXT_TOKEN=$(echo "$RESP" | jq -r '.nextPageToken // "null"')
        IS_LAST=$(echo "$RESP" | jq -r '.isLast // true')

        if [ "$IS_LAST" = "true" ] || [ "$NEXT_TOKEN" = "null" ]; then
          break
        fi
      done
