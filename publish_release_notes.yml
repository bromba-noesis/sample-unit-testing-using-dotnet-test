trigger: none

pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: Atlassian

steps:
- script: |
      set -euo pipefail

      #hardcoded!
      JIRA_VERSION_ID = "1.2.1"
      RELEASE_TITLE = "Release Notes – Version 1.2.1" 

      echo "Generating and publishing release notes..."

      # ---------------------------
      # Base64 encode credentials
      # ---------------------------
      JIRA_AUTH=$(echo -n "$JIRA_EMAIL:$JIRA_API_TOKEN" | base64)
      CONF_AUTH=$(echo -n "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" | base64)
      
      # ---------------------------
      # Get release notes from Jira
      # ---------------------------
      JIRA_URL="$JIRA_BASE_URL/rest/api/3/version/$JIRA_VERSION_ID/notes?style=html"
      echo "Fetching Jira release notes for version $JIRA_VERSION_ID..."
